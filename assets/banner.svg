<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Humanize OS</title>
  <desc id="desc">Humanize OS: a Claude skill and scanner that rewrites AI-sounding text so it reads like a person wrote it, without changing what it says.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.5" stop-color="#1b1535">
        <animate attributeName="stop-color" values="#1b1535;#241a3a;#1b1535" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#0d1a24"/>
    </linearGradient>
    <linearGradient id="titleFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="0.55" stop-color="#fcd9a8"/>
      <stop offset="1" stop-color="#f59e6b"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.15 0;0.15 0;-0.15 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="barFill" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7c6cf0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f7a26b"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7a26b" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f7a26b" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f7a26b" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f59e6b" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f59e6b" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="barsClip"><rect x="790" y="60" width="370" height="200" rx="14"/></clipPath>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .fade-up { opacity: 0; animation: fadeUp 1.2s ease-out forwards; }
    .d1 { animation-delay: 0.2s; } .d2 { animation-delay: 0.6s; } .d3 { animation-delay: 1s; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .title { animation: breathe 6s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { opacity: 0.94; } 50% { opacity: 1; } }

    .tell { fill: #a5b4fc; animation: tellFade 10s ease-in-out infinite; }
    .strike { stroke: #f7a26b; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 120; stroke-dashoffset: 120; animation: strike 10s ease-in-out infinite; }
    .s1 { animation-delay: 1.2s; } .s2 { animation-delay: 1.5s; } .s3 { animation-delay: 1.8s; } .s4 { animation-delay: 2.1s; } .s5 { animation-delay: 2.4s; }
    @keyframes strike { 0%, 8% { stroke-dashoffset: 120; } 18%, 80% { stroke-dashoffset: 0; } 92%, 100% { stroke-dashoffset: 120; } }
    @keyframes tellFade { 0%, 10% { opacity: 0.95; } 20%, 78% { opacity: 0.4; } 92%, 100% { opacity: 0.95; } }

    .dot { fill: #fcd9a8; animation: drift 14s linear infinite; }
    @keyframes drift { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 0.55; } 85% { opacity: 0.35; } 100% { transform: translateY(-120px); opacity: 0; } }
  </style>

  <!-- background -->
  <rect width="1200" height="300" fill="url(#bg)"/>
  <circle cx="330" cy="140" r="260" fill="url(#halo)">
    <animate attributeName="r" values="240;275;240" dur="10s" repeatCount="indefinite"/>
  </circle>
  <g opacity="0.07" stroke="#ffffff">
    <line x1="0" y1="26" x2="1200" y2="26"/>
    <line x1="0" y1="282" x2="1200" y2="282"/>
  </g>

  <!-- drifting particles -->
  <g>
    <circle class="dot" cx="120" cy="290" r="1.6" style="animation-delay:0s"/>
    <circle class="dot" cx="260" cy="300" r="1.2" style="animation-delay:3s"/>
    <circle class="dot" cx="410" cy="295" r="1.8" style="animation-delay:6s"/>
    <circle class="dot" cx="560" cy="300" r="1.3" style="animation-delay:1.5s"/>
    <circle class="dot" cx="690" cy="292" r="1.5" style="animation-delay:8s"/>
    <circle class="dot" cx="760" cy="300" r="1.1" style="animation-delay:4.5s"/>
    <circle class="dot" cx="1170" cy="296" r="1.4" style="animation-delay:10s"/>
    <circle class="dot" cx="40" cy="300" r="1.2" style="animation-delay:11.5s"/>
  </g>

  <!-- left: identity -->
  <g class="fade-up d1">
    <rect x="66" y="50" width="216" height="26" rx="13" fill="#ffffff" fill-opacity="0.06" stroke="#fcd9a8" stroke-opacity="0.35"/>
    <text x="174" y="68" text-anchor="middle" class="mono" font-size="13" fill="#fcd9a8" letter-spacing="1">CLAUDE SKILL · humanize</text>
  </g>

  <text x="66" y="150" class="sans title" font-size="76" font-weight="800" fill="url(#titleFill)" filter="url(#glow)" letter-spacing="-1.5">Humanize OS</text>

  <g class="fade-up d2">
    <text x="70" y="190" class="sans" font-size="21" fill="#e2e8f0">Rewrites AI-sounding text so it reads like a person wrote it.</text>
    <text x="70" y="218" class="sans" font-size="15" fill="#94a3b8">Never invent. Every fact, number, and name in the output exists in the input.</text>
  </g>

  <!-- tells being struck through -->
  <g class="mono fade-up d3" font-size="15">
    <text class="tell s1" x="70"  y="252" textLength="45" lengthAdjust="spacingAndGlyphs">delve</text>
    <text class="tell s2" x="139" y="252" textLength="72" lengthAdjust="spacingAndGlyphs">leverage</text>
    <text class="tell s3" x="235" y="252" textLength="54" lengthAdjust="spacingAndGlyphs">robust</text>
    <text class="tell s4" x="313" y="252" textLength="72" lengthAdjust="spacingAndGlyphs">seamless</text>
    <text class="tell s5" x="409" y="252" textLength="63" lengthAdjust="spacingAndGlyphs">synergy</text>
    <line class="strike s1" x1="67"  y1="247" x2="118" y2="247"/>
    <line class="strike s2" x1="136" y1="247" x2="214" y2="247"/>
    <line class="strike s3" x1="232" y1="247" x2="292" y2="247"/>
    <line class="strike s4" x1="310" y1="247" x2="388" y2="247"/>
    <line class="strike s5" x1="406" y1="247" x2="475" y2="247"/>
  </g>

  <!-- right: sentence rhythm, flat to varied -->
  <g>
    <rect x="790" y="60" width="370" height="200" rx="14" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="812" y="86" class="mono" font-size="12" fill="#94a3b8" letter-spacing="1">SENTENCE LENGTH</text>
    <text x="1138" y="86" text-anchor="end" class="mono" font-size="12" fill="#f7a26b" letter-spacing="1">
      <tspan>flat → varied</tspan>
      <animate attributeName="opacity" values="0.5;1;1;0.5" keyTimes="0;0.3;0.85;1" dur="8s" repeatCount="indefinite"/>
    </text>
    <line x1="812" y1="236" x2="1138" y2="236" stroke="#ffffff" stroke-opacity="0.12"/>

    <g clip-path="url(#barsClip)" fill="url(#barFill)">
      <rect x="816"  width="14" rx="3" y="176" height="60"><animate attributeName="height" values="60;60;38;38;60"  keyTimes="0;0.2;0.45;0.85;1" dur="8s" begin="0s"    repeatCount="indefinite"/><animate attributeName="y" values="176;176;198;198;176" keyTimes="0;0.2;0.45;0.85;1" dur="8s" begin="0s"    repeatCount="indefinite"/></rect>
      <rect x="839"  width="14" rx="3" y="176" height="60"><animate attributeName="height" values="60;60;96;96;60"  keyTimes="0;0.2;0.45;0.85;1" dur="8s" begin="0.06s" repeatCount="indefinite"/><animate attributeName="y" values="176;176;140;140;176" keyTimes="0;0.2;0.45;0.85;1" dur="8s" begin="0.06s" repeatCount="indefinite"/></rect>
      <rect x="862"  width="14" rx="3" y="176" height="60"><animate attributeName="height" values="60;60;26;26;60"  keyTimes="0;0.2;0.45;0.85;1" dur="8s" begin="0.12s" repeatCount="indefinite"/><animate attributeName="y" values="176;176;210;210;176" keyTimes="0;0.2;0.45;0.85;1" dur="8s" begin="0.12s" repeatCount="indefinite"/></rect>
      <rect x="885"  width="14" rx="3" y="176" height="60"><animate attributeName="height" values="60;60;118;118;60" keyTimes="0;0.2;0.45;0.85;1" dur="8s" begin="0.18s" repeatCount="indefinite"/><animate attributeName="y" values="176;176;118;118;176" keyTimes="0;0.2;0.45;0.85;1" dur="8s" begin="0.18s" repeatCount="indefinite"/></rect>
      <rect x="908"  width="14" rx="3" y="176" height="60"><animate attributeName="height" values="60;60;54;54;60"  keyTimes="0;0.2;0.45;0.85;1" dur="8s" begin="0.24s" repeatCount="indefinite"/><animate attributeName="y" values="176;176;182;182;176" keyTimes="0;0.2;0.45;0.85;1" dur="8s" begin="0.24s" repeatCount="indefinite"/></rect>
      <rect x="931"  width="14" rx="3" y="176" height="60"><animate attributeName="height" values="60;60;18;18;60"  keyTimes="0;0.2;0.45;0.85;1" dur="8s" begin="0.30s" repeatCount="indefinite"/><animate attributeName="y" values="176;176;218;218;176" keyTimes="0;0.2;0.45;0.85;1" dur="8s" begin="0.30s" repeatCount="indefinite"/></rect>
      <rect x="954"  width="14" rx="3" y="176" height="60"><animate attributeName="height" values="60;60;82;82;60"  keyTimes="0;0.2;0.45;0.85;1" dur="8s" begin="0.36s" repeatCount="indefinite"/><animate attributeName="y" values="176;176;154;154;176" keyTimes="0;0.2;0.45;0.85;1" dur="8s" begin="0.36s" repeatCount="indefinite"/></rect>
      <rect x="977"  width="14" rx="3" y="176" height="60"><animate attributeName="height" values="60;60;132;132;60" keyTimes="0;0.2;0.45;0.85;1" dur="8s" begin="0.42s" repeatCount="indefinite"/><animate attributeName="y" values="176;176;104;104;176" keyTimes="0;0.2;0.45;0.85;1" dur="8s" begin="0.42s" repeatCount="indefinite"/></rect>
      <rect x="1000" width="14" rx="3" y="176" height="60"><animate attributeName="height" values="60;60;44;44;60"  keyTimes="0;0.2;0.45;0.85;1" dur="8s" begin="0.48s" repeatCount="indefinite"/><animate attributeName="y" values="176;176;192;192;176" keyTimes="0;0.2;0.45;0.85;1" dur="8s" begin="0.48s" repeatCount="indefinite"/></rect>
      <rect x="1023" width="14" rx="3" y="176" height="60"><animate attributeName="height" values="60;60;68;68;60"  keyTimes="0;0.2;0.45;0.85;1" dur="8s" begin="0.54s" repeatCount="indefinite"/><animate attributeName="y" values="176;176;168;168;176" keyTimes="0;0.2;0.45;0.85;1" dur="8s" begin="0.54s" repeatCount="indefinite"/></rect>
      <rect x="1046" width="14" rx="3" y="176" height="60"><animate attributeName="height" values="60;60;24;24;60"  keyTimes="0;0.2;0.45;0.85;1" dur="8s" begin="0.60s" repeatCount="indefinite"/><animate attributeName="y" values="176;176;212;212;176" keyTimes="0;0.2;0.45;0.85;1" dur="8s" begin="0.60s" repeatCount="indefinite"/></rect>
      <rect x="1069" width="14" rx="3" y="176" height="60"><animate attributeName="height" values="60;60;104;104;60" keyTimes="0;0.2;0.45;0.85;1" dur="8s" begin="0.66s" repeatCount="indefinite"/><animate attributeName="y" values="176;176;132;132;176" keyTimes="0;0.2;0.45;0.85;1" dur="8s" begin="0.66s" repeatCount="indefinite"/></rect>
      <rect x="1092" width="14" rx="3" y="176" height="60"><animate attributeName="height" values="60;60;58;58;60"  keyTimes="0;0.2;0.45;0.85;1" dur="8s" begin="0.72s" repeatCount="indefinite"/><animate attributeName="y" values="176;176;178;178;176" keyTimes="0;0.2;0.45;0.85;1" dur="8s" begin="0.72s" repeatCount="indefinite"/></rect>
      <rect x="1115" width="14" rx="3" y="176" height="60"><animate attributeName="height" values="60;60;34;34;60"  keyTimes="0;0.2;0.45;0.85;1" dur="8s" begin="0.78s" repeatCount="indefinite"/><animate attributeName="y" values="176;176;202;202;176" keyTimes="0;0.2;0.45;0.85;1" dur="8s" begin="0.78s" repeatCount="indefinite"/></rect>

      <!-- scanner sweep -->
      <rect y="96" width="60" height="140" fill="url(#scan)">
        <animate attributeName="x" values="760;1160" dur="4s" repeatCount="indefinite"/>
      </rect>
    </g>

    <text x="812" y="252" class="mono" font-size="11" fill="#64748b">stdlib-only scanner · scripts/detect.py</text>
  </g>
</svg>
